<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="icon" type="image/png" href="../../assets/logo/logo-carnes-carneiro.png">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Catalog.jsx"></script>
<script type="text/babel" src="ProductDetailPage.jsx"></script>
<script type="text/babel" src="History.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
function App(){
  const { Header, Footer } = window.CarnesCarneiroDesignSystem_2087cc;
  const [page, setPage] = React.useState('home');
  const [selected, setSelected] = React.useState(null);
  const navMap = {home:'Início',catalog:'Catálogo',product:'Catálogo',history:'A Nossa História',contact:'Contacto'};
  const pages = {
    home: <window.Home setPage={setPage} />,
    catalog: <window.Catalog setPage={setPage} setSelected={setSelected} />,
    product: <window.ProductDetailPage product={selected} setPage={setPage} />,
    history: <window.History />,
    contact: <window.Contact />,
  };
  return (
    <div>
      <Header active={navMap[page]} logoSrc="../../assets/logo/logo-carnes-carneiro.png"
        onNavigate={(l)=>{ const key = Object.keys(navMap).find(k=>navMap[k]===l && k!=='product'); if(key) setPage(key); }} />
      {pages[page]}
      <Footer logoSrc="../../assets/logo/logo-carnes-carneiro.png" />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
